<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>TransHover</title>
  <style>
    body { width: 360px; margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    h2 { font-size: 13px; margin: 14px 0 6px; color: #374151; }
    label { display: block; margin-bottom: 8px; }
    label.check { display: flex; gap: 6px; align-items: center; }
    input[type="text"], input[type="password"], select, textarea {
      width: 100%; box-sizing: border-box; margin-top: 3px; padding: 5px; font: inherit;
    }
    textarea { resize: vertical; }
    button { padding: 5px 10px; font: inherit; cursor: pointer; }
    button.active { background: #1f2937; color: #f9fafb; }
    button:disabled { opacity: 0.5; cursor: default; }
    .seg { display: flex; gap: 6px; margin-top: 4px; align-items: center; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    #status { color: #15803d; }
    #status[data-error="true"] { color: #b91c1c; }
    small { color: #6b7280; }
  </style>
</head>
<body>
  <h1>TransHover</h1>

  <label>Провайдер
    <select id="provider">
      <option value="openrouter">OpenRouter</option>
      <option value="openai">OpenAI</option>
    </select>
  </label>

  <label>Ключ OpenRouter
    <input id="openrouterKey" type="password" autocomplete="off">
  </label>

  <label>Ключ OpenAI
    <input id="openaiKey" type="password" autocomplete="off">
  </label>

  <div>
    <div class="seg">
      <button id="fltFree" type="button">Бесплатные</button>
      <button id="fltPaid" type="button">Платные</button>
      <button id="reloadModels" type="button">Обновить</button>
    </div>
    <label style="margin-top: 8px;">Модель
      <select id="model"></select>
    </label>
    <small id="modelHint"></small>
  </div>

  <label style="margin-top: 8px;">Язык перевода
    <input id="targetLang" type="text" placeholder="Russian">
  </label>

  <h2>Отображение</h2>
  <label class="check">
    <input id="replaceInPlace" type="checkbox"> Заменять текст на странице (выкл. — подсказка над словом)
  </label>
  <label class="check">
    <input id="useSelection" type="checkbox"> Переводить выделенный мышкой текст при наведении с клавишей
  </label>

  <h2>Эксперт</h2>
  <label class="check">
    <input id="autoExpert" type="checkbox"> Автоопределение эксперта
  </label>
  <label>Эксперт (при ручном выборе)
    <select id="expert"></select>
  </label>

  <label>Дополнительный промпт
    <textarea id="customPrompt" rows="4" placeholder="Например: сохраняй английские термины в скобках"></textarea>
  </label>

  <div class="row">
    <button id="save" type="button">Сохранить</button>
    <button id="translatePage" type="button">Перевести страницу</button>
  </div>
  <div class="row"><span id="status"></span></div>

  <script src="experts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
